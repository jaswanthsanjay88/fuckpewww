<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            background: #1C1B18;
            color: #FAF8F5;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-icon {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            background: rgba(217, 119, 87, 0.16);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D97757;
        }
        h2 {
            font-size: 13.5px;
            font-weight: 600;
            color: #FAF8F5;
            letter-spacing: -0.01em;
        }
        .kbd-hint {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            padding: 2px 7px;
            font-size: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #D4D4D8;
        }
        .status-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            color: #A8A29E;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #78716C;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .status-dot.active {
            background: #34D399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.6);
        }
        .file-card {
            display: none;
            background: rgba(217, 119, 87, 0.08);
            border: 1px solid rgba(217, 119, 87, 0.22);
            border-radius: 8px;
            padding: 7px 10px;
            margin-bottom: 12px;
            font-size: 11px;
            color: #FAF8F5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-card span.icon {
            margin-right: 5px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            width: 100%;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #dlBtn {
            background: #D97757;
            color: #FFFFFF;
            box-shadow: 0 4px 14px rgba(217, 119, 87, 0.28);
        }
        #dlBtn:hover {
            background: #C26243;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(217, 119, 87, 0.38);
        }
        #batchSlidesBtn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #FAF8F5;
        }
        #batchSlidesBtn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(217, 119, 87, 0.4);
            transform: translateY(-1px);
        }
        #batchNotesBtn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #D4D4D8;
            font-size: 11.5px;
            padding: 8px 12px;
        }
        #batchNotesBtn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #FAF8F5;
        }
        .btn:active {
            transform: translateY(0);
        }
        .progress-box {
            display: none;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #34D399;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 11px;
            color: #A8A29E;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cancel-btn {
            background: none;
            border: none;
            color: #F87171;
            font-size: 10.5px;
            cursor: pointer;
            text-decoration: underline;
        }
        #status {
            margin-top: 10px;
            font-size: 11.5px;
            text-align: center;
            font-weight: 500;
            min-height: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">
            <div class="logo-icon">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
            </div>
            <h2>Fcuk-Pewww</h2>
        </div>
        <span class="kbd-hint">Ctrl + S</span>
    </div>

    <div class="status-card">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">Checking PDF status...</span>
    </div>

    <div id="fileCard" class="file-card">
        <span class="icon">📄</span>
        <span id="fileName">document.pdf</span>
    </div>

    <div class="btn-group">
        <button id="dlBtn" class="btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download Document
        </button>

        <button id="batchSlidesBtn" class="btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span id="batchSlidesText">⚡ Auto-Download All Slides (1 to 7)</span>
        </button>

        <button id="batchNotesBtn" class="btn">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>📚 Auto-Download All Notes in List</span>
        </button>
    </div>

    <div id="progressBox" class="progress-box">
        <div class="progress-bar-bg">
            <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
        <div class="progress-text">
            <span id="progressMsg">Downloading 1 of 7...</span>
            <button id="cancelBatchBtn" class="cancel-btn">Stop</button>
        </div>
    </div>

    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
